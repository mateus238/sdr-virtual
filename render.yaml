services:
  - type: web
    name: sdr-virtual
    runtime: docker
    plan: starter            # disco persistente exige plano pago (confirme o preço no site da Render)
    healthCheckPath: /health
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: QR_BRIDGE_TOKEN
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TIMEZONE
        value: America/Sao_Paulo
